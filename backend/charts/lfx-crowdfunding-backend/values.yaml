---
replicaCount: 2

image:
  repository: ghcr.io/linuxfoundation/lfx-crowdfunding-backend
  pullPolicy: Always
  tag: "" # required — set per environment via ArgoCD values

imagePullSecrets: []

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  # Must be disabled before/at the same time heimdall.enabled is flipped to
  # true (in lfx-v2-argocd values) — otherwise the backend stays reachable
  # directly via this Ingress, bypassing every Heimdall RuleSet-only control
  # (published-list/owner-info denies, process-approval openfga_check).
  # Tracked in #282.
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

livenessProbe:
  httpGet:
    path: /livez
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /readyz
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# ── Non-secret environment variables ────────────────────────────────────────
# These are rendered into a ConfigMap and mounted via envFrom.
config:
  JWKS_URL: ""
  JWT_AUDIENCE: ""
  JWT_ISSUER: ""
  LEDGER_BASE_URL: ""
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  OTEL_SERVICE_NAME: "lfx-crowdfunding-backend"
  # REQUIRED — the frontend URL Stripe redirects to after a 3DS challenge.
  # Must be the public HTTPS URL of the /payment/complete page, e.g.:
  #   https://crowdfunding.linuxfoundation.org/payment/complete
  # Leaving this empty will cause helm install/upgrade to fail.
  STRIPE_RETURN_URL: ""
  # Comma-separated LF SSO usernames allowed to approve or decline initiatives.
  # Example: "alice,bob,carol"
  ALLOWED_APPROVERS: ""
  # fga-sync NATS access-check client (LFXV2-2956 M1). Optional — leave empty
  # to disable; no access checks are made on any request path yet (M2).
  FGA_NATS_URL: ""
  FGA_ACCESS_CHECK_TIMEOUT: "5s"

# ── Heimdall API gateway onboarding (LFXV2-3352, draft — not yet cut over) ───
# Disabled by default so this chart is a no-op until lfx-v2-argocd flips it.
# See lfx-v2-query-service's chart for the reference pattern.
heimdall:
  enabled: false
  # add_middleware must be true in THIS chart when heimdall.enabled is true:
  # unlike lfx-namespace platform services, the HTTPRoute's Middleware
  # ExtensionRef is namespace-local, so Middleware/heimdall must exist in
  # crowdfunding-backend's own namespace. false is not a viable steady state
  # once heimdall.enabled is true.
  add_middleware: false
  url: http://lfx-platform-heimdall.lfx.svc.cluster.local:4456

# openfga.enabled gates the per-initiative openfga_check authorizers in
# ruleset.yaml (me-initiative-write, the announcement rules, process-approval).
# Stays false until this backend emits FGA tuples for its initiatives — the
# crowdfunding_initiative FGA type (lfx-v2-helm#172) has merged, but until
# tuples exist there's nothing to check against, so a real check would deny
# everyone. Does NOT gate the services rule (owner-info/published-list) —
# that rule's tuples are platform-managed, already exist in every env, and
# it always checks FGA regardless of this flag.
openfga:
  enabled: false

lfx:
  # domain is the base domain used to build the Heimdall HTTPRoute hostname
  # (lfx-api.<domain>). Per-environment — set via ArgoCD values.
  domain: k8s.orb.local

app:
  # use_oidc_contextualizer is a boolean to determine if the OIDC contextualizer should be used
  use_oidc_contextualizer: false
  # audience is the JWT aud claim Heimdall's create_jwt finalizer stamps onto
  # tokens forwarded to this service, and what HEIMDALL_JWT_AUDIENCE must
  # match once dual-accept (LFXV2-3351) is live.
  audience: lfx-crowdfunding-backend
  # approversTeamName is the OpenFGA team object process-approval is checked
  # against (relation: member) once openfga.enabled is true. Name fixed by
  # the accepted ADR (backend/docs/rewrite/12-fga-authorization-model.md).
  approversTeamName: crowdfunding_approvers
  # servicesTeamName is the OpenFGA team object the owner-info/published-list
  # M2M routes are checked against (relation: member) whenever heimdall.enabled
  # is true — this check is not gated on openfga.enabled, since its tuples
  # are platform-managed and already exist in every env. Members are
  # client-credentials callers as user:<client_id>@clients (e.g. the
  # Reimbursement Service), added the same way a user would be. Name decided
  # by Architecture (#281, 2026-09-17): role-named like the platform's other
  # teams, not "m2m"-named.
  servicesTeamName: crowdfunding-services

traefik:
  gateway:
    name: lfx-platform-gateway
    namespace: lfx

# ── Additional environment variables ─────────────────────────────────────────
# Rendered as a Kubernetes env: list on the Deployment and CronJob.
# Supports the full env entry schema (value:, valueFrom:, etc.).
# Override in ArgoCD values to inject secretKeyRef entries (e.g. DB components).
env: []

# ── Secret environment variables ─────────────────────────────────────────────
# These are sourced from a Kubernetes Secret via envFrom.secretRef.
# The Secret itself is managed externally (e.g. External Secrets Operator
# syncing from AWS Secrets Manager).
#
# Expected keys in the Secret:
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, LEDGER_API_KEY
#   username, password, host, port, dbname — RDS components (referenced via env: above)
secretName: lfx-crowdfunding-backend-secrets

# createPlaceholderSecret — opt-in, defaults to false.
#
# When false (default): the Secret must already exist before helm install runs.
# ESO (or another operator) creates and owns it with the default
# creationPolicy: Owner. This is the correct setting for all non-local
# environments.
#
# When true: the chart creates an empty Secret placeholder via a pre-install
# hook so the Deployment's envFrom.secretRef resolves on a brand-new cluster
# with no pre-existing Secret (e.g. local development with kind/minikube).
# WARNING: if ESO is also managing this Secret it MUST be configured with
# creationPolicy: Merge — otherwise ESO will refuse to take ownership of a
# Secret it did not create and the sync will fail silently.
createPlaceholderSecret: false

# ── CronJob: mentorship-sync ──────────────────────────────────────────────────
# Runs daily to pull Mentorship program data from Snowflake and upsert into
# initiatives (initiative_type=mentorship) and initiative_beneficiaries.
#
# DEV: set fixtureFile to /app/testdata/programs.json — no Snowflake config needed.
# Staging/prod: leave fixtureFile empty.
#   Non-secret config (ACCOUNT, USER, WAREHOUSE, DATABASE, ROLE) → env: in ArgoCD values.
#   Secret (SNOWFLAKE_PRIVATE_KEY only) → external secret (lfx-crowdfunding-backend-secrets).
mentorshipSyncCronJob:
  enabled: false
  schedule: "0 2 * * *"    # daily at 02:00 UTC
  # fixtureFile: path inside the container to a JSON fixture file.
  # When set, the CronJob skips Snowflake and reads from this file instead.
  # Override to "/app/testdata/programs.json" in DEV.
  fixtureFile: ""
  image:
    # Defaults to same repository and tag as the main API image.
    # Override only if building a separate image for the CronJob.
    repository: ""
    tag: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid

# ── CronJob: ledger-stats-sync ────────────────────────────────────────────────
# Runs hourly to sync financial data from the ledger service into initiative_ledger_stats.
# ── DB migration Job (pre-install/pre-upgrade Helm hook) ─────────────────────
# Runs `/app/migrate` (backend/cmd/migrate) before the new Deployment/CronJob
# pods start, applying any pending backend/db/migrations/*.up.sql via
# golang-migrate.
# IMPORTANT: any environment whose schema was hand-applied without a tracking
# table must run `migrate force <current-version>` once before this is enabled,
# or the hook will attempt to re-apply migration 001 and fail the release.
# Disable for environments where migrations are applied out-of-band.
migrationJob:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # Fail the release rather than hang if the DB is unreachable/misconfigured.
  activeDeadlineSeconds: 120
  backoffLimit: 2

cronJob:
  enabled: true
  schedule: "0 * * * *"    # every hour on the hour
  image:
    # Defaults to same repository and tag as the main API image.
    # Override only if building a separate image for the CronJob.
    repository: ""
    tag: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # Retain last 3 successful and 1 failed job for debugging
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  # Forbid concurrent runs (previous job must complete before next fires)
  concurrencyPolicy: Forbid
