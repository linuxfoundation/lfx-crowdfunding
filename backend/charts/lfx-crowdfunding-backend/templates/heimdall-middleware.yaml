{{ if .Values.heimdall.add_middleware }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: heimdall
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lfx-v2-initiatives-service.labels" . | nindent 4 }}
spec:
  forwardAuth:
    address: "{{ .Values.heimdall.url }}"
    authResponseHeaders:
      - Authorization
    # initiative-attribution-write reads the body (Request.Body()); without
    # this Heimdall gets headers only and its deny_all guard denies every
    # request (lfx-crowdfunding#383).
    forwardBody: true
{{- end }}
