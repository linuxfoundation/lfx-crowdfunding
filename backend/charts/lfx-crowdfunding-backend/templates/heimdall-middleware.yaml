{{ if .Values.heimdall.add_middleware }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: heimdall
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lfx-v2-initiatives-service.labels" . | nindent 4 }}
spec:
  forwardAuth:
    address: "{{ .Values.heimdall.url }}"
    authResponseHeaders:
      - Authorization
{{- end }}
