#
# Mirrors the route tiers wired in backend/cmd/initiatives-api/server.go.
# The platform default_rule denies in staging/prod (lfx-v2-argocd
# values/global/lfx-platform.yaml) but allows in dev (values/dev/lfx-platform.yaml) —
# every path is still listed explicitly here so behavior doesn't depend on that
# default and an omitted path 403s in staging/prod instead of falling through.
#
# openfga.enabled gates the openfga_check authorizers below. It defaults to
# false: the crowdfunding_initiative FGA type has merged (lfx-v2-helm#172),
# but this backend does not yet emit any FGA tuples for it, so there is
# nothing to check against yet. See values.yaml for details. The one
# exception is the services rule (owner-info/published-list), which always
# checks FGA — its team tuples are platform-managed and already exist in
# every env, so it doesn't wait on this flag.
{{- if .Values.heimdall.enabled }}
---
apiVersion: heimdall.dadrus.github.com/v1alpha4
kind: RuleSet
metadata:
  name: {{ include "lfx-v2-initiatives-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lfx-v2-initiatives-service.labels" . | nindent 4 }}
spec:
  rules:
    # Health checks — unauthenticated.
    - id: "rule:lfx:lfx-crowdfunding-backend:health"
      allow_encoded_slashes: "off"
      match:
        methods:
          - GET
        routes:
          - path: /livez
          - path: /healthz
          - path: /readyz
      execute:
        - authenticator: anonymous_authenticator
        - authorizer: allow_all

    # Stripe webhook — authenticated by its own HMAC signature, not JWT.
    - id: "rule:lfx:lfx-crowdfunding-backend:stripe-webhook"
      allow_encoded_slashes: "off"
      match:
        methods:
          - POST
        routes:
          - path: /crowdfunding/stripe/webhook
      execute:
        - authenticator: anonymous_authenticator
        - authorizer: allow_all

    # Public read routes — no auth required, but authenticate opportunistically
    # (oidc first, falling back to anonymous) so a caller's principal is still
    # signed into the forwarded JWT when present.
    - id: "rule:lfx:lfx-crowdfunding-backend:public"
      allow_encoded_slashes: "off"
      match:
        methods:
          - GET
        routes:
          - path: /crowdfunding/statistics
          - path: /crowdfunding/statistics/platform
          - path: /crowdfunding/statistics/monthly
          - path: /crowdfunding/statistics/recent-donations
          - path: /crowdfunding/statistics/investing-companies
          - path: /crowdfunding/initiatives
          - path: /crowdfunding/initiatives/:id/transactions
          - path: /crowdfunding/initiatives/:id/announcements
      execute:
        - authenticator: oidc
        - authenticator: anonymous_authenticator
        {{- if .Values.app.use_oidc_contextualizer }}
        - contextualizer: oidc_contextualizer
        {{- end }}
        - authorizer: allow_all
        - finalizer: create_jwt
          config:
            values:
              aud: {{ .Values.app.audience }}

    # M2M routes (owner-info, published-list) — consumer is the Reimbursement
    # Service (04-target-architecture.md:261,347), an M2M/client-credentials
    # caller. Decided in #281 (Architecture, 2026-09-17): machine callers get
    # the same FGA-team check a user would on this route, not a bespoke
    # machine-only authorizer — Heimdall already renders a client-credentials
    # caller as user:<client_id>@clients (openfga_check config below), so
    # putting that identity in team:{{ "{{ .Values.app.servicesTeamName }}" }}
    # and checking relation: member is the same shape as process-approval's
    # team check further down. No path capture needed — static object.
    #
    # Without this rule, published-list (a single path segment) would fall
    # into the initiative-detail wildcard below (/crowdfunding/initiatives/:id) and
    # become public; owner-info falls through to default_rule (deny_all in
    # staging/prod) instead.
    #
    # Always openfga_check, not gated on openfga.enabled: that flag waits on
    # #277's per-initiative writer tuples, but this rule's tuples
    # (user:<client_id>@clients member of the services team) are written by
    # platform and already exist in dev/staging/prod. Still fails closed —
    # there's no in-app fallback on these two routes (unlike process-approval's
    # ALLOWED_APPROVERS), so any caller without the tuple 403s.
    # No anonymous_authenticator pairing: anonymous callers 401 here (fail
    # auth) rather than 403 (denied authz) like an authenticated caller does.
    - id: "rule:lfx:lfx-crowdfunding-backend:services"
      allow_encoded_slashes: "off"
      match:
        methods:
          - GET
        routes:
          - path: /crowdfunding/initiatives/:id/owner-info
          - path: /crowdfunding/initiatives/published-list
      execute:
        - authenticator: oidc
        {{- if .Values.app.use_oidc_contextualizer }}
        - contextualizer: oidc_contextualizer
        {{- end }}
        - authorizer: openfga_check
          config:
            values:
              relation: member
              object: "team:{{ .Values.app.servicesTeamName }}"
        - finalizer: create_jwt
          config:
            values:
              aud: {{ .Values.app.audience }}
              scope: access:manage

    # Initiative detail — auth optional, principal used if present but not required.
    # viewer on crowdfunding_initiative is [user:*] or writer, i.e. public by design,
    # so this stays allow_all even once openfga.enabled is true.
    - id: "rule:lfx:lfx-crowdfunding-backend:initiative-detail"
      allow_encoded_slashes: "off"
      match:
        methods:
          - GET
        routes:
          - path: /crowdfunding/initiatives/:id
      execute:
        - authenticator: oidc
        - authenticator: anonymous_authenticator
        {{- if .Values.app.use_oidc_contextualizer }}
        - contextualizer: oidc_contextualizer
        {{- end }}
        - authorizer: allow_all
        - finalizer: create_jwt
          config:
            values:
              aud: {{ .Values.app.audience }}

    # Authenticated user routes with no initiative object to check — self-scoped
    # by the caller's own principal (profile, payment methods, own donation/
    # subscription/organization lists, own initiative list/create).
    - id: "rule:lfx:lfx-crowdfunding-backend:me-self"
      allow_encoded_slashes: "off"
      match:
        # Every verb used across this rule's routes: PATCH (profile sync, org
        # update), GET (lists/reads), POST (org/setup-intent/payment-method/
        # presigned-url create), DELETE (subscription cancel, org delete,
        # payment-method delete). Omitting this defaults to GET+POST only
        # (Heimdall's match.methods default), which silently falls PATCH/DELETE
        # through to default_rule — allow_all with no aud override in dev, so
        # SyncProfile's JWT lacks the audience the backend's JWT middleware
        # requires and every login's PATCH /crowdfunding/me 401s.
        methods:
          - GET
          - POST
          - PATCH
          - DELETE
        routes:
          - path: /crowdfunding/me
          # chi registers r.Patch("/") inside the /me route group as the literal
          # "/crowdfunding/me/" — list both shapes so SyncProfile doesn't fall through
          # to the default deny_all rule.
          - path: /crowdfunding/me/
          - path: /crowdfunding/me/donations
          - path: /crowdfunding/me/donations/csv
          - path: /crowdfunding/me/transactions
          - path: /crowdfunding/me/subscriptions
          - path: /crowdfunding/me/subscriptions/:*
          - path: /crowdfunding/me/organizations
          - path: /crowdfunding/me/organizations/:*
          - path: /crowdfunding/me/setup-intent
          - path: /crowdfunding/me/payment-method
          - path: /crowdfunding/me/payment-account
          - path: /crowdfunding/me/presigned-url
          - path: /crowdfunding/me/initiatives
      execute:
        - authenticator: oidc
        {{- if .Values.app.use_oidc_contextualizer }}
        - contextualizer: oidc_contextualizer
        {{- end }}
        - authorizer: allow_all
        - finalizer: create_jwt
          config:
            values:
              aud: {{ .Values.app.audience }}
              scope: access:me

    # Manager reads: an initiative in any status, with contacts, and its
    # transactions. Authorized here with openfga_check writer, not in the service
    # behind allow_all (the service's canManage check stays as defense in depth).
    # Callers may pass a slug, but crowdfunding_initiative tuples are keyed by
    # UUID, so a slug goes through crowdfunding_slug_resolver_contextualizer first.
    # That resolver 404s on a UUID and continue_pipeline_on_error is false, so it
    # is skipped for UUID captures, and the UUID branch checks the raw capture,
    # never the skipped contextualizer's Outputs. Hence two mutually exclusive
    # openfga_check entries. $uuidRe is defined once so the branches stay exact
    # negations. Same pattern as lfx-v2-campaign-service's project-api rule.
    - id: "rule:lfx:lfx-crowdfunding-backend:initiative-manage-read"
      allow_encoded_slashes: "off"
      match:
        methods:
          - GET
        routes:
          - path: /crowdfunding/initiatives/:id/manage
          - path: /crowdfunding/initiatives/:id/manage/transactions
      execute:
        - authenticator: oidc
        {{- if .Values.app.use_oidc_contextualizer }}
        - contextualizer: oidc_contextualizer
        {{- end }}
        {{- if .Values.openfga.enabled }}
        {{- $uuidRe := "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" }}
        - contextualizer: crowdfunding_slug_resolver_contextualizer
          if: '!Request.URL.Captures.id.matches("{{ $uuidRe }}")'
          config:
            values:
              slug: "{{ "{{- .Request.URL.Captures.id -}}" }}"
        - authorizer: openfga_check
          if: '!Request.URL.Captures.id.matches("{{ $uuidRe }}")'
          config:
            values:
              relation: writer
              object: "crowdfunding_initiative:{{ "{{- .Outputs.crowdfunding_slug_resolver_contextualizer.uid -}}" }}"
        - authorizer: openfga_check
          if: 'Request.URL.Captures.id.matches("{{ $uuidRe }}")'
          config:
            values:
              relation: writer
              object: "crowdfunding_initiative:{{ "{{- .Request.URL.Captures.id -}}" }}"
        {{- else }}
        - authorizer: allow_all
        {{- end }}
        - finalizer: create_jwt
          config:
            values:
              aud: {{ .Values.app.audience }}
              scope: access:me

    # Reads on a specific owned initiative. The first two are deprecated aliases
    # of initiative-manage-read, kept allow_all (service-side canManage only)
    # until lfx-self-serve moves to /manage and they are removed. my-transactions
    # is the caller's own donor history, open to any authenticated donor.
    - id: "rule:lfx:lfx-crowdfunding-backend:me-initiative-read"
      allow_encoded_slashes: "off"
      match:
        methods:
          - GET
        routes:
          - path: /crowdfunding/me/initiatives/:id
          - path: /crowdfunding/me/initiatives/:id/transactions
          - path: /crowdfunding/me/initiatives/:id/my-transactions
      execute:
        - authenticator: oidc
        {{- if .Values.app.use_oidc_contextualizer }}
        - contextualizer: oidc_contextualizer
        {{- end }}
        - authorizer: allow_all
        - finalizer: create_jwt
          config:
            values:
              aud: {{ .Values.app.audience }}
              scope: access:me

    # Internal-only: called by lfx-v2-helm's crowdfunding_slug_resolver_contextualizer
    # (from other services' Heimdall pipelines, e.g. lfx-self-serve), never
    # directly by an end user. No anonymous_authenticator pairing here — the
    # oidc authenticator accepts the raw end-user token the contextualizer
    # forwards. Pairing it with anonymous_authenticator would let
    # unauthenticated callers reach allow_all and get a free create_jwt token
    # that then satisfies this endpoint's own auth check — i.e. anonymous
    # slug-to-UID enumeration. Do not add it back. Mirrors
    # lfx-v2-project-service's projects:slug-to-uid rule.
    #
    # TODO: any caller with a *valid* token (not just the contextualizer) can
    # still hit this directly and learn a non-published initiative's slug
    # resolves to a real UUID (ResolveSlugToUID ignores status). The UUID
    # alone doesn't grant access — GetByID still denies non-approvers — but
    # it does confirm existence. Tighten with a dedicated M2M scope or
    # network boundary once the contextualizer integration is wired up.
    - id: "rule:lfx:lfx-crowdfunding-backend:slug-to-uid"
      allow_encoded_slashes: "off"
      match:
        methods:
          - GET
        routes:
          - path: /crowdfunding/initiatives/slug-to-uid/:slug
      execute:
        - authenticator: oidc
        {{- if .Values.app.use_oidc_contextualizer }}
        - contextualizer: oidc_contextualizer
        {{- end }}
        - authorizer: allow_all
        - finalizer: create_jwt
          config:
            values:
              aud: {{ .Values.app.audience }}

    # Mutations on a specific initiative — UUID-only in practice (no
    # frontend or self-serve caller sends a slug here), so this is the route
    # that gets a real per-object openfga_check once openfga.enabled.
    # /crowdfunding/initiatives/:id is the canonical path (initiative-scoped, writer-
    # guarded); /crowdfunding/me/initiatives/:id is a deprecated alias until Self
    # Serve migrates. A denial is a 403 here; the service-side check still 404s.
    - id: "rule:lfx:lfx-crowdfunding-backend:me-initiative-write"
      allow_encoded_slashes: "off"
      match:
        methods:
          - PATCH
          - DELETE
        routes:
          - path: /crowdfunding/me/initiatives/:id
          - path: /crowdfunding/initiatives/:id
      execute:
        - authenticator: oidc
        {{- if .Values.app.use_oidc_contextualizer }}
        - contextualizer: oidc_contextualizer
        {{- end }}
        {{- if .Values.openfga.enabled }}
        - authorizer: openfga_check
          config:
            values:
              relation: writer
              object: "crowdfunding_initiative:{{ "{{- .Request.URL.Captures.id -}}" }}"
        {{- else }}
        - authorizer: allow_all
        {{- end }}
        - finalizer: create_jwt
          config:
            values:
              aud: {{ .Values.app.audience }}
              scope: access:me

    # Per-entity initiative lists for the Org/Project lens pages: every initiative
    # attributed to one parent, guarded on writer for that parent. A denial is a 403.
    - id: "rule:lfx:lfx-crowdfunding-backend:org-initiatives-list"
      allow_encoded_slashes: "off"
      match:
        methods:
          - GET
        routes:
          - path: /crowdfunding/organizations/:uid/initiatives
      execute:
        - authenticator: oidc
        {{- if .Values.app.use_oidc_contextualizer }}
        - contextualizer: oidc_contextualizer
        {{- end }}
        # Always enforced, even when openfga.enabled is false: this list exposes
        # unpublished initiatives, so it must never fall back to allow_all.
        - authorizer: openfga_check
          config:
            values:
              relation: writer
              object: "b2b_org:{{ "{{- .Request.URL.Captures.uid -}}" }}"
        - finalizer: create_jwt
          config:
            values:
              aud: {{ .Values.app.audience }}
              scope: access:me

    - id: "rule:lfx:lfx-crowdfunding-backend:project-initiatives-list"
      allow_encoded_slashes: "off"
      match:
        methods:
          - GET
        routes:
          - path: /crowdfunding/projects/:uid/initiatives
      execute:
        - authenticator: oidc
        {{- if .Values.app.use_oidc_contextualizer }}
        - contextualizer: oidc_contextualizer
        {{- end }}
        # Always enforced, even when openfga.enabled is false: this list exposes
        # unpublished initiatives, so it must never fall back to allow_all.
        - authorizer: openfga_check
          config:
            values:
              relation: writer_guard
              object: "project:{{ "{{- .Request.URL.Captures.uid | lower -}}" }}"
        - finalizer: create_jwt
          config:
            values:
              aud: {{ .Values.app.audience }}
              scope: access:me

    # Announcement create — POST /crowdfunding/me/initiatives/:id/announcements.
    - id: "rule:lfx:lfx-crowdfunding-backend:me-initiative-announcement-create"
      allow_encoded_slashes: "off"
      match:
        methods:
          - POST
        routes:
          - path: /crowdfunding/me/initiatives/:id/announcements
          - path: /crowdfunding/initiatives/:id/announcements
      execute:
        - authenticator: oidc
        {{- if .Values.app.use_oidc_contextualizer }}
        - contextualizer: oidc_contextualizer
        {{- end }}
        {{- if .Values.openfga.enabled }}
        - authorizer: openfga_check
          config:
            values:
              relation: writer
              object: "crowdfunding_initiative:{{ "{{- .Request.URL.Captures.id -}}" }}"
        {{- else }}
        - authorizer: allow_all
        {{- end }}
        - finalizer: create_jwt
          config:
            values:
              aud: {{ .Values.app.audience }}
              scope: access:me

    # Announcement update/delete — PUT/DELETE on a specific announcement,
    # separate rule from create because it's a different method set.
    - id: "rule:lfx:lfx-crowdfunding-backend:me-initiative-announcement-write"
      allow_encoded_slashes: "off"
      match:
        methods:
          - PUT
          - DELETE
        routes:
          - path: /crowdfunding/me/initiatives/:id/announcements/:announcementId
          - path: /crowdfunding/initiatives/:id/announcements/:announcementId
      execute:
        - authenticator: oidc
        {{- if .Values.app.use_oidc_contextualizer }}
        - contextualizer: oidc_contextualizer
        {{- end }}
        {{- if .Values.openfga.enabled }}
        - authorizer: openfga_check
          config:
            values:
              relation: writer
              object: "crowdfunding_initiative:{{ "{{- .Request.URL.Captures.id -}}" }}"
        {{- else }}
        - authorizer: allow_all
        {{- end }}
        - finalizer: create_jwt
          config:
            values:
              aud: {{ .Values.app.audience }}
              scope: access:me

    # Donations/subscriptions list on a specific initiative — allow_all
    # regardless of openfga.enabled, but for a different reason per resource:
    # DonationHandler.List/SubscriptionHandler.List never check the caller's
    # principal (list any initiative's donations/subscriptions, not just the
    # caller's own). Donations are already public via the unauthenticated
    # /crowdfunding/initiatives/{id}/transactions projection (same DonationSummary
    # shape, no new exposure — donation view/mutation is deliberately not
    # CF-authorization-gated, Slack decision). Subscription list has no public
    # equivalent elsewhere, so this does grant any authenticated user the
    # per-initiative subscription schedule (amount/frequency/next charge
    # date) — Subscription.UserID/OrganizationID/Stripe IDs stay json:"-", so
    # no PII/payment identifiers leak. Accepted for now; split further or add
    # an ownership check if that needs tightening.
    - id: "rule:lfx:lfx-crowdfunding-backend:me-initiative-donate-list"
      allow_encoded_slashes: "off"
      match:
        methods:
          - GET
        routes:
          - path: /crowdfunding/me/initiatives/:id/donations
          - path: /crowdfunding/me/initiatives/:id/subscriptions
      execute:
        - authenticator: oidc
        {{- if .Values.app.use_oidc_contextualizer }}
        - contextualizer: oidc_contextualizer
        {{- end }}
        - authorizer: allow_all
        - finalizer: create_jwt
          config:
            values:
              aud: {{ .Values.app.audience }}
              scope: access:me

    # Donation/subscription creation on a specific initiative — the caller is
    # genuinely the donor/subscriber here (DonationService.Create /
    # SubscriptionService.Create record the authenticated principal), so
    # allow_all is correct for these methods regardless of openfga.enabled.
    - id: "rule:lfx:lfx-crowdfunding-backend:me-initiative-donate-create"
      allow_encoded_slashes: "off"
      match:
        methods:
          - POST
        routes:
          - path: /crowdfunding/me/initiatives/:id/donations
          - path: /crowdfunding/me/initiatives/:id/subscriptions
      execute:
        - authenticator: oidc
        {{- if .Values.app.use_oidc_contextualizer }}
        - contextualizer: oidc_contextualizer
        {{- end }}
        - authorizer: allow_all
        - finalizer: create_jwt
          config:
            values:
              aud: {{ .Values.app.audience }}
              scope: access:me

    # Approval action — checked against a global approvers team, not the
    # per-initiative object, so no path capture is needed and the slug/UUID
    # ambiguity on :id doesn't apply here. Static object, same shape as
    # lfx-v2-member-service's "team:{{`{{ globalOrgAdminTeamName }}`}}" rule.
    # ALLOWED_APPROVERS stays as the in-app fallback until this is enabled.
    - id: "rule:lfx:lfx-crowdfunding-backend:process-approval"
      allow_encoded_slashes: "off"
      match:
        methods:
          - POST
        routes:
          - path: /crowdfunding/initiatives/:id/process-approval/:*
      execute:
        - authenticator: oidc
        {{- if .Values.app.use_oidc_contextualizer }}
        - contextualizer: oidc_contextualizer
        {{- end }}
        {{- if .Values.openfga.enabled }}
        - authorizer: openfga_check
          config:
            values:
              relation: member
              object: "team:{{ .Values.app.approversTeamName }}"
        {{- else }}
        - authorizer: allow_all
        {{- end }}
        - finalizer: create_jwt
          config:
            values:
              aud: {{ .Values.app.audience }}
              scope: access:me

    # Expense actions — authenticated, no scope check. reportId is an
    # Expensify report id, not an FGA object, so there is nothing for the
    # gateway to check it against. Per-report authorization is enforced in
    # ExpenseHandler.ProcessAction: the caller's email must be one the
    # Reimbursement Service sent the approval email to (Heimdall tokens carry
    # no email, so it is read from the caller's user row). Tracked in #283.
    - id: "rule:lfx:lfx-crowdfunding-backend:expense"
      allow_encoded_slashes: "off"
      match:
        methods:
          - POST
        routes:
          - path: /crowdfunding/expense/:*/:*
      execute:
        - authenticator: oidc
        {{- if .Values.app.use_oidc_contextualizer }}
        - contextualizer: oidc_contextualizer
        {{- end }}
        - authorizer: allow_all
        - finalizer: create_jwt
          config:
            values:
              aud: {{ .Values.app.audience }}
{{- end }}
