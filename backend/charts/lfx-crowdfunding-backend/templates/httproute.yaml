{{- if .Values.heimdall.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "lfx-v2-initiatives-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.traefik.gateway.name }}
      namespace: {{ .Values.traefik.gateway.namespace }}
  hostnames:
    - "lfx-api.{{ .Values.lfx.domain }}"
  rules:
    # Stripe webhook — needs the raw body forwarded for HMAC verification.
    - matches:
        - path:
            type: Exact
            value: /v1/stripe/webhook
      {{- if .Values.heimdall.add_middleware }}
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: heimdall-forward-body
      {{- end }}
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "lfx-v2-initiatives-service.fullname" . }}
          port: {{ .Values.service.port }}
          weight: 1
    # Everything else.
    - matches:
        - path:
            type: PathPrefix
            value: /
      {{- if .Values.heimdall.add_middleware }}
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: heimdall
      {{- end }}
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "lfx-v2-initiatives-service.fullname" . }}
          port: {{ .Values.service.port }}
          weight: 1
{{- end }}
