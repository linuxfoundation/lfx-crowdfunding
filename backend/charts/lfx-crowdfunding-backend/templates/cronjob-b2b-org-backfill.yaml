{{- if .Values.b2bOrgBackfillCronJob.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "lfx-v2-initiatives-service.fullname" . }}-b2b-org-backfill
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lfx-v2-initiatives-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: b2b-org-backfill
    tags.datadoghq.com/service: {{ include "lfx-v2-initiatives-service.name" . }}
spec:
  schedule: {{ .Values.b2bOrgBackfillCronJob.schedule | quote }}
  concurrencyPolicy: {{ .Values.b2bOrgBackfillCronJob.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.b2bOrgBackfillCronJob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.b2bOrgBackfillCronJob.failedJobsHistoryLimit }}
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "lfx-v2-initiatives-service.name" . }}
        tags.datadoghq.com/service: {{ include "lfx-v2-initiatives-service.name" . }}
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "lfx-v2-initiatives-service.name" . }}
            app.kubernetes.io/component: b2b-org-backfill
            tags.datadoghq.com/service: {{ include "lfx-v2-initiatives-service.name" . }}
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ include "lfx-v2-initiatives-service.serviceAccountName" . }}
          automountServiceAccountToken: false
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: b2b-org-backfill
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              image: "{{ .Values.b2bOrgBackfillCronJob.image.repository | default .Values.image.repository }}:{{ .Values.b2bOrgBackfillCronJob.image.tag | default (required "image.tag is required" .Values.image.tag) }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["/app/b2b-org-backfill"]
              {{- with .Values.env }}
              env:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              envFrom:
                - configMapRef:
                    name: {{ include "lfx-v2-initiatives-service.fullname" . }}-config
                - secretRef:
                    name: {{ .Values.secretName }}
              resources:
                {{- toYaml .Values.b2bOrgBackfillCronJob.resources | nindent 16 }}
{{- end }}
